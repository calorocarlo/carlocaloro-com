name: Fetch news + match themes

on:
  schedule:
    - cron: '7 * * * *'      # ogni ora
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install feedparser pyyaml
      - name: Fetch news
        run: python pipeline/scripts/fetch-news.py
      - name: Match themes
        run: python pipeline/scripts/match-themes.py
      - name: Publish feed.json
        run: cp pipeline/static/data/feed.json data/feed.json
      - name: Commit + rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if git diff --staged --quiet; then echo "Nessun cambiamento"; exit 0; fi
          git commit -m "Auto: feed.json [bot]"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
